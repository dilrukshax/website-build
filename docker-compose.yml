version: '3.8'

# =============================================================
# Development Docker Compose
# Database: Neon DB (external) — no local Postgres needed
# Usage: docker compose up -d
# =============================================================

services:
  # ─── Infrastructure ────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: booking-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
