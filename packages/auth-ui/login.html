<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Project Aurora</title>
    <meta name="description" content="Sign in to your Project Aurora admin dashboard." />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Animated background -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="auth-page">

        <!-- ── LOGIN VIEW ── -->
        <div class="auth-card view" id="loginView">
            <div class="auth-brand">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to manage your bookings</p>
            </div>

            <!-- Alert -->
            <div class="alert alert-error" id="loginAlert" role="alert">
                <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                </svg>
                <span class="alert-msg"></span>
            </div>

            <form id="loginForm" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input id="loginEmail" type="email" class="form-input" placeholder="jane@mybusiness.com"
                               required autocomplete="email" />
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <input id="loginPassword" type="password" class="form-input has-toggle"
                               placeholder="Your password" required autocomplete="current-password" />
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:block">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot password link -->
                <div class="auth-links-row" style="margin-bottom: 8px;">
                    <span></span>
                    <a href="forgot-password.html" class="auth-link" style="font-size:0.8125rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                No account yet? <a href="register.html" class="auth-link">Create one for free</a>
            </div>
        </div>

        <!-- ── SUCCESS VIEW ── -->
        <div class="auth-card view" id="loginSuccess" style="display:none">
            <div class="success-view">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h2 class="success-title">Signed in!</h2>
                <p class="success-desc">
                    Welcome back, <strong id="loginSuccessName"></strong>.<br/>
                    Your role: <span id="loginSuccessRole" style="color:var(--brand-accent); font-weight:600;"></span>
                </p>
                <a href="#" class="btn-primary" style="display:inline-block; text-decoration:none; width:auto; padding:13px 32px; margin:0 auto;">
                    Go to Dashboard
                </a>
            </div>
        </div>

    </main>

    <script src="auth.js"></script>
</body>
</html>
