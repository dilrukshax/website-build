<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — Project Aurora</title>
    <meta
      name="description"
      content="Create your multi-tenant Project Aurora account."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated background -->
    <div class="bg-orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="auth-page">
      <!-- ── REGISTER VIEW ── -->
      <div class="auth-card view" id="registerView">
        <div class="auth-brand">
          <div class="auth-logo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </div>
          <h1 class="auth-title">Create Your Account</h1>
          <p class="auth-subtitle">Set up your Project Aurora workspace in minutes</p>
        </div>

        <!-- Alert -->
        <div class="alert alert-error" id="registerAlert" role="alert">
          <svg
            class="alert-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" x2="12" y1="8" y2="12" />
            <line x1="12" x2="12.01" y1="16" y2="16" />
          </svg>
          <span class="alert-msg"></span>
        </div>

        <form id="registerForm" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <div class="input-wrapper">
              <input
                id="fullName"
                type="text"
                class="form-input"
                placeholder="Jane Smith"
                required
                autocomplete="name"
              />
              <svg
                class="input-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrapper">
              <input
                id="email"
                type="email"
                class="form-input"
                placeholder="jane@mybusiness.com"
                required
                autocomplete="email"
              />
              <svg
                class="input-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                class="form-input has-toggle"
                placeholder="Min 8 chars, upper, lower, number"
                required
                autocomplete="new-password"
              />
              <svg
                class="input-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <button
                type="button"
                class="toggle-password"
                data-target="password"
                aria-label="Toggle password visibility"
              >
                <svg
                  class="icon-eye"
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                  style="display: block"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="icon-eye-off"
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"
                  />
                </svg>
              </button>
            </div>
            <div class="password-strength">
              <div class="strength-bars">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <span class="strength-text"></span>
            </div>
          </div>

          <!-- Business Name + Type -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="businessName">Business Name</label>
              <div class="input-wrapper">
                <input
                  id="businessName"
                  type="text"
                  class="form-input"
                  placeholder="Sunset Tours"
                  required
                />
                <svg
                  class="input-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                  />
                </svg>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="businessType">Business Type</label>
              <div class="input-wrapper">
                <select id="businessType" class="form-input" required>
                  <option value="" disabled selected>Select type</option>
                  <option value="tourism">Tourism</option>
                  <option value="salon">Salon &amp; Beauty</option>
                  <option value="consulting">Consulting</option>
                  <option value="fitness">Fitness</option>
                  <option value="hospitality">Hospitality</option>
                  <option value="medical">Medical</option>
                  <option value="education">Education</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Subdomain -->
          <div class="form-group">
            <label class="form-label" for="subdomain">Your Subdomain</label>
            <div
              class="input-wrapper"
              style="display: flex; align-items: center"
            >
              <input
                id="subdomain"
                type="text"
                class="form-input"
                placeholder="sunset-tours"
                required
                pattern="^[a-z0-9][a-z0-9-]*[a-z0-9]$"
                style="border-radius: 8px 0 0 8px; border-right: 0"
              />
              <span
                style="
                  padding: 0 12px;
                  background: rgba(255, 255, 255, 0.04);
                  border: 1px solid var(--border-subtle);
                  border-left: 0;
                  border-radius: 0 8px 8px 0;
                  color: var(--text-muted);
                  font-size: 0.875rem;
                  height: 44px;
                  display: flex;
                  align-items: center;
                  white-space: nowrap;
                "
                >.bookingapp.com</span
              >
            </div>
            <p
              style="
                font-size: 0.75rem;
                color: var(--text-muted);
                margin-top: 5px;
              "
            >
              Lowercase letters, numbers, and hyphens only
            </p>
          </div>

          <!-- Terms -->
          <div class="check-group">
            <input type="checkbox" id="terms" required />
            <label for="terms"
              >I agree to the
              <a href="#" class="auth-link">Terms of Service</a> and
              <a href="#" class="auth-link">Privacy Policy</a></label
            >
          </div>

          <button type="submit" class="btn-primary" id="registerBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner"></span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account?
          <a href="login.html" class="auth-link">Sign in</a>
        </div>
      </div>

      <!-- ── SUCCESS VIEW ── -->
      <div class="auth-card view" id="registerSuccess" style="display: none">
        <div class="success-view">
          <div class="success-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>
          <h2 class="success-title">
            Welcome aboard, <span id="successName"></span>!
          </h2>
          <p class="success-desc">
            <strong id="successBiz"></strong> is all set up.<br />
            You're now logged in and ready to start managing your bookings.
          </p>
          <a
            href="login.html"
            class="btn-primary"
            style="
              display: inline-block;
              text-decoration: none;
              width: auto;
              padding: 13px 32px;
              margin: 0 auto;
            "
          >
            Go to Dashboard
          </a>
        </div>
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
