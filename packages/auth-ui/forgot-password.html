<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Project Aurora</title>
    <meta name="description" content="Request a password reset link for your Project Aurora account." />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Animated background -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="auth-page">

        <!-- ── FORGOT PASSWORD FORM VIEW ── -->
        <div class="auth-card view" id="forgotView">
            <div class="auth-brand">
                <div class="auth-logo" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
            </div>

            <!-- Alert -->
            <div class="alert alert-error" id="forgotAlert" role="alert">
                <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                </svg>
                <span class="alert-msg"></span>
            </div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="forgotEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input id="forgotEmail" type="email" class="form-input"
                               placeholder="jane@mybusiness.com" required autocomplete="email" />
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="forgotBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                <a href="login.html" class="auth-link">← Back to Sign In</a>
            </div>
        </div>

        <!-- ── SUCCESS VIEW ── -->
        <div class="auth-card view" id="forgotSuccess" style="display:none">
            <div class="success-view">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="success-title">Check Your Email</h2>
                <p class="success-desc">
                    If your email is registered, a password reset link has been sent.<br/>
                    <strong>Development mode:</strong> Check the API server console for the reset link.
                </p>
                <a href="login.html" class="btn-primary" style="display:inline-block; text-decoration:none; width:auto; padding:13px 32px; margin:0 auto;">
                    Back to Sign In
                </a>
            </div>
        </div>

    </main>

    <script src="auth.js"></script>
</body>
</html>
