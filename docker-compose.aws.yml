version: '3.8'

# =============================================================
# Production Docker Compose — AWS Single Instance
# Architecture: Single container running both API & CMS
# Usage: docker compose -f docker-compose.aws.yml up -d
# =============================================================

services:
  # ─── Primary Application (API + CMS) ───────────────────────
  app:
    # Use the unified image built from the root Dockerfile
    # In a real AWS setup, this would point to your ECR image URI
    # image: 123456789012.dkr.ecr.region.amazonaws.com/booking-engine:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-engine-app
    restart: unless-stopped
    ports:
      # Expose both ports to the host
      - "${API_PORT:-3002}:3002"
      - "${CMS_PORT:-3001}:3001"
    environment:
      # --- General ---
      NODE_ENV: production
      PORT: 3002
      CMS_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # --- URLs ---
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env}
      CMS_URL: ${CMS_URL:?Set CMS_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      NEXT_PUBLIC_WEBSITE_BUILDER_API_URL: ${NEXT_PUBLIC_WEBSITE_BUILDER_API_URL:-${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      WEBSITE_BUILDER_API_URL: ${WEBSITE_BUILDER_API_URL:-${API_BASE_URL:?Set API_BASE_URL in .env}}
      NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:?Set NEXT_PUBLIC_SITE_DOMAIN in .env}

      # --- Database & Redis ---
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (Neon DB connection string)}
      # If using AWS ElastiCache, point REDIS_URL to it. Otherwise, defaults to local container.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis}@redis:6379}

      # --- Auth ---
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-7d}

      # --- Cloudflare ---
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - booking_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── Redis Cache (In-Container fallback) ───────────────────
  # If you use AWS ElastiCache instead, you can remove this block completely
  # and update REDIS_URL in the app environment variables.
  redis:
    image: redis:7-alpine
    container_name: booking-engine-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

volumes:
  redis_data:
    driver: local

networks:
  booking_network:
    driver: bridge
